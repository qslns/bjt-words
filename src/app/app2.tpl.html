<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F4F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F131C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BJT 단어">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>BJT 단어 회독</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=BIZ+UDPMincho:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
body.jf-g{--f-jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","BIZ UDPGothic","MS PGothic","Yu Gothic","Noto Sans JP","Noto Sans CJK JP",sans-serif;--f-kyo:"Hiragino Kaku Gothic ProN","Hiragino Sans","BIZ UDPGothic","MS PGothic","Yu Gothic","Noto Sans JP","Noto Sans CJK JP",sans-serif}
:root{
  /* 공부 노트: 방안지 종이 · 블루블랙 잉크 · 형광펜(목표어) · 빨간 펜(부수) · 인주(済 도장) · 장(章)은 노트 표지 */
  --bg:#F2F4F7;--surface:#FFFFFF;--surface-2:#EAEDF2;
  --ink:#1A2133;--ink-2:#4A5367;--ink-3:#6F788F;
  --line:#D2D8E2;--line-2:#E4E8EF;
  --accent:#243A7C;--on-accent:#FFFFFF;
  --fill:#1A2133;--on-fill:#F2F4F7;
  --stamp:#C53B28;--on-stamp:#FFFFFF;
  --ng:#B0302A;--ng-bg:#FAE2DE;--ok:#27704A;--ok-bg:#DCEFE3;
  --bkA:#27407F;--bkA2:#1B2E61;--bkB:#2B6A55;--bkB2:#1E4E3E;--bkZ:#B13D27;--bkZ2:#86301F;
  --on-bk:#FFFFFF;--on-bk2:rgba(255,255,255,.74);--ribbon:#C9CED8;--on-ribbon:#1A2133;
  --tg:#F7E96E;--mask:#DCE1EA;--scrim:rgba(18,24,38,.42);
  --shadow:0 1px 0 rgba(26,33,51,.04),0 18px 40px -26px rgba(26,33,51,.5);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
  --f-jp:"Hiragino Mincho ProN","Hiragino Mincho Pro","YuMincho","Yu Mincho","BIZ UDPMincho","MS PMincho","Noto Serif JP","Noto Serif CJK JP",serif;
  --f-kyo:"Hiragino Mincho ProN","Hiragino Mincho Pro","YuMincho","Yu Mincho","BIZ UDPMincho","MS PMincho","Noto Serif JP","Noto Serif CJK JP",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F131C;--surface:#171C28;--surface-2:#1E2433;
  --ink:#E6EAF2;--ink-2:#ADB5C6;--ink-3:#8C95AA;
  --line:#2E3648;--line-2:#222938;
  --accent:#9FB6FF;--on-accent:#0E1733;
  --fill:#E6EAF2;--on-fill:#0F131C;
  --stamp:#EE6F55;--on-stamp:#1A0904;
  --ng:#F3907F;--ng-bg:#3A1F1E;--ok:#7DCB9D;--ok-bg:#17322A;
  --bkA:#34508F;--bkA2:#243A6E;--bkB:#2F7560;--bkB2:#225646;--bkZ:#B84A33;--bkZ2:#8C3826;
  --on-bk:#F4F6FA;--on-bk2:rgba(244,246,250,.76);--ribbon:#4A5263;--on-ribbon:#F4F6FA;
  --tg:#5E5717;--mask:#262D3D;--scrim:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 18px 40px -26px rgba(0,0,0,.9);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131C;--surface:#171C28;--surface-2:#1E2433;
  --ink:#E6EAF2;--ink-2:#ADB5C6;--ink-3:#8C95AA;
  --line:#2E3648;--line-2:#222938;
  --accent:#9FB6FF;--on-accent:#0E1733;
  --fill:#E6EAF2;--on-fill:#0F131C;
  --stamp:#EE6F55;--on-stamp:#1A0904;
  --ng:#F3907F;--ng-bg:#3A1F1E;--ok:#7DCB9D;--ok-bg:#17322A;
  --bkA:#34508F;--bkA2:#243A6E;--bkB:#2F7560;--bkB2:#225646;--bkZ:#B84A33;--bkZ2:#8C3826;
  --on-bk:#F4F6FA;--on-bk2:rgba(244,246,250,.76);--ribbon:#4A5263;--on-ribbon:#F4F6FA;
  --tg:#5E5717;--mask:#262D3D;--scrim:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 18px 40px -26px rgba(0,0,0,.9);
  color-scheme:dark}

/* ---------- base ---------- */
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow:hidden}
[lang="ja"]{font-family:var(--f-jp)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:disabled{cursor:default;opacity:.4}
[role="button"]{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
ruby{ruby-align:center}
rt{font-family:var(--f-jp);font-size:.5em;font-weight:500;color:var(--ink-2);letter-spacing:0}
.grow{flex:1}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:18px 32px}

/* ---------- 상단 바 ---------- */
.bar{flex:none;display:flex;align-items:center;gap:8px;min-height:60px;padding-inline:16px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bg)}
.tb{min-height:44px;min-width:44px;padding:0 12px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:500;color:var(--ink-2);border:1px solid transparent;white-space:nowrap}
.tb:active{background:var(--surface-2)}
.tb[aria-pressed="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.tb svg{flex:none}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--f-mono);font-weight:500;font-size:15px;letter-spacing:.14em;padding:3px 7px 2px;border:1px solid var(--ink);line-height:1}
.brand span{font-weight:600;font-size:17px;white-space:nowrap}
.dchip{font-family:var(--f-ui);font-weight:700;font-size:15px;padding:4px 10px;border-radius:999px;background:var(--stamp);color:var(--on-stamp);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar-title{font-size:17px;font-weight:600;white-space:nowrap}
@media (max-width:480px){.tb .sm-hide{display:none}.tb{padding:0 9px;font-size:14px}.bar{gap:4px}.brand span{font-size:15px}}

/* ---------- 버튼 ---------- */
.btn{min-height:50px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn:active{background:var(--surface-2)}
.btn small{font-family:var(--f-mono);font-weight:500;color:var(--ink-3);font-size:14px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary small{color:var(--on-accent);opacity:.8}
.btn.danger{color:var(--ng);border-color:var(--ng);background:var(--surface)}
.btn.big{min-height:60px;font-size:18px}
.link{min-height:44px;padding:0 8px;font-size:15px;color:var(--ink-2);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--bg);max-width:100%}
.seg button{min-height:42px;padding:0 14px;border-radius:7px;font-size:15px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fill);color:var(--on-fill)}
.chip{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:15px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
.tb-t{font-family:var(--f-mono);font-weight:500;font-size:12px;min-width:24px;height:22px;padding:0 5px;display:inline-grid;place-items:center;border:1px solid var(--ink);border-radius:4px;color:var(--ink)}
.t-S{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
.note{font-size:14px;color:var(--ink-2);line-height:1.65}
.note b{color:var(--ink);font-weight:600}

/* ---------- 홈 ---------- */
.home{display:flex;flex-direction:column;gap:22px}
.resume{width:100%;min-height:74px;border-radius:16px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;gap:16px;padding:12px 22px;text-align:left;box-shadow:var(--shadow)}
.resume .r-k{font-size:13px;font-weight:600;opacity:.85;letter-spacing:.04em}
.resume .r-t{font-size:clamp(18px,2.3vw,24px);font-weight:700;line-height:1.3}
.resume .r-go{margin-left:auto;font-size:clamp(17px,2vw,22px);font-weight:700;white-space:nowrap}
.resume:active{filter:brightness(.95)}
.grp{display:flex;flex-direction:column;gap:10px}
.grp-h{display:flex;align-items:baseline;gap:10px;font-size:14px;color:var(--ink-2)}
.grp-h b{font-size:16px;color:var(--ink);font-weight:700}
.grp-h .rule{flex:1;border-top:1px dashed var(--line)}
.books{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(10px,1.6vw,20px)}
@media (max-width:620px){.books{grid-template-columns:repeat(3,minmax(0,1fr))}.book{aspect-ratio:3/4}.bbody{padding-bottom:50px}.b-range{font-size:14px}}
.book{position:relative;aspect-ratio:5/6;border-radius:14px;overflow:hidden;display:flex;color:var(--on-bk);text-align:center;box-shadow:var(--shadow);max-width:100%}
.book:active{filter:brightness(.94)}
.blkA{background:var(--bkA)}.blkB{background:var(--bkB)}.blkZ{background:var(--bkZ)}
.book .spine{flex:none;width:18%;height:100%}
.blkA .spine{background:var(--bkA2)}.blkB .spine{background:var(--bkB2)}.blkZ .spine{background:var(--bkZ2)}
.bbody{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(2px,.5vw,6px);padding:10px 6px 44px}
.b-ch{font-family:var(--f-kyo);font-weight:600;font-size:clamp(24px,3.4vw,40px);line-height:1.1;letter-spacing:.02em}
.b-pass{font-size:clamp(12px,1.35vw,16px);font-weight:500;color:var(--on-bk2)}
.b-range{font-family:var(--f-mono);font-size:clamp(14px,1.8vw,21px);font-weight:500;color:var(--on-bk);font-variant-numeric:tabular-nums;white-space:nowrap}
.b-sub{font-size:clamp(12px,1.3vw,15px);font-weight:700;color:var(--on-bk)}
.b-done{font-size:clamp(11px,1.15vw,13px);color:var(--on-bk2)}
.ribbon{position:absolute;top:10px;left:0;background:var(--ribbon);color:var(--on-ribbon);font-weight:700;font-size:clamp(11px,1.2vw,14px);padding:4px 14px 4px 10px;clip-path:polygon(0 0,100% 0,88% 50%,100% 100%,0 100%);z-index:1}
.b-acts{position:absolute;left:18%;right:0;bottom:8px;display:flex;justify-content:center;gap:8px;z-index:1}
.b-btn{width:44px;height:36px;border-radius:9px;border:1.5px solid var(--on-bk2);color:var(--on-bk);display:grid;place-items:center}
.b-btn:active{background:rgba(255,255,255,.14)}
.book.wide{aspect-ratio:auto;min-height:150px}
.book.wide .bbody{flex-direction:row;flex-wrap:wrap;gap:6px 18px;padding:16px 16px 52px}
.zrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:clamp(10px,1.6vw,20px);align-items:stretch}
@media (max-width:620px){.zrow{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:10px;justify-content:center}
.side .btn{justify-content:space-between;width:100%}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.guide{border-top:1px dashed var(--line);padding-top:10px}
.guide summary{min-height:48px;display:flex;align-items:center;font-weight:600;font-size:16px;cursor:pointer;list-style:none}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";margin-left:auto;font-family:var(--f-mono);font-size:20px;color:var(--ink-3)}
.guide[open] summary::after{content:"−"}
.guide ol{margin:4px 0 8px;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--ink-2);line-height:1.7}
.guide ol b{color:var(--ink)}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.sync.cloud i{background:var(--ok)}.sync.local i{background:var(--stamp)}

/* ---------- 학습 화면 ---------- */
.sbar{flex:none;display:flex;align-items:center;gap:8px;min-height:62px;padding-inline:12px 16px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bg)}
.sb-t{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.sb-t b{font-size:clamp(15px,1.7vw,19px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-t span{font-size:13px;color:var(--ink-3);white-space:nowrap}
.sb-p{display:flex;flex-direction:column;align-items:center;line-height:1.2;margin-inline:auto;padding-inline:8px}
.sb-p b{font-family:var(--f-mono);font-size:clamp(17px,2vw,22px);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.sb-p span{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pbar{height:4px;background:var(--line-2);flex:none}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.star svg{width:24px;height:24px}
.star[aria-pressed="true"]{color:var(--stamp)}
.stage{min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:14px 24px;max-width:1500px;margin:0 auto;width:100%}
.cf-top{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.cf-top .no{font-family:var(--f-mono);color:var(--ink-3)}
.phase{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--ng-bg);color:var(--ng)}
.phase.weak{background:var(--surface-2);color:var(--ink)}
.cf-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,30px);padding-block:clamp(10px,3vh,40px);text-align:center}
.cf-word{font-family:var(--f-kyo);font-weight:500;line-height:1.08;letter-spacing:.03em;color:var(--ink);padding:6px 18px;border-radius:18px;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}
.cf-word:active{background:var(--surface-2)}
.w1,.w2{font-size:clamp(96px,min(23vw,30vh),250px)}
.w3{font-size:clamp(84px,min(18vw,25vh),210px)}
.w4{font-size:clamp(70px,min(14.5vw,21vh),175px)}
.w5{font-size:clamp(58px,min(12vw,18vh),145px)}
.w6{font-size:clamp(48px,min(10vw,15vh),120px)}
.w7,.w8{font-size:clamp(36px,min(8vw,12vh),96px);letter-spacing:.01em}
.cf-hint{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-3)}
.cf-hint svg{width:18px;height:18px}
.cf-sent{font-size:clamp(20px,min(3.2vw,4.2vh),38px);line-height:1.6;max-width:30em;color:var(--ink-2);padding:6px 10px;border-radius:12px}
.cf-sent:active{background:var(--surface-2)}
.tg{font-weight:700;color:var(--ink);background:linear-gradient(transparent 58%,var(--tg) 58%);border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.abar{flex:none;border-top:1px solid var(--line);background:var(--bg);padding-inline:16px;padding-block:12px 14px}
.abar-in{display:flex;gap:clamp(10px,1.6vw,22px);justify-content:center;max-width:1180px;margin:0 auto}
.ab{flex:1 1 0;max-width:360px;min-height:clamp(64px,9.5vh,100px);border-radius:999px;font-size:clamp(19px,2.3vw,28px);font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 3px 0 rgba(0,0,0,.14)}
.ab:active{transform:translateY(2px);box-shadow:none}
.ab svg{width:1.05em;height:1.05em;flex:none}
.ab-ex{background:var(--fill);color:var(--on-fill)}
.ab-ng{background:var(--ng-bg);color:var(--ng)}
.ab-ok{background:var(--accent);color:var(--on-accent)}
.ab-next{background:var(--accent);color:var(--on-accent);max-width:760px}
@media (max-width:480px){.abar{padding-inline:10px}.abar-in{gap:8px}.ab{font-size:18px;min-height:62px}.ab svg{display:none}}

/* ---------- 해설 ---------- */
.ex{display:flex;flex-direction:column;gap:20px;padding-block:2px 10px}
.ex-a,.ex-b{display:contents}
.s-ans{order:1}.s-pt{order:3}.s-sent{order:4}.s-pair{order:5}.s-kp{order:6}
@media (min-width:960px){
  .ex{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:start}
  .ex-a,.ex-b{display:flex;flex-direction:column;gap:20px;min-width:0}
}
.ans{display:flex;flex-direction:column;gap:4px}
.ans-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.ans-top .no{font-family:var(--f-mono);color:var(--ink-3)}
.ans-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ans-hw{font-family:var(--f-kyo);font-weight:500;font-size:clamp(48px,7vw,86px);line-height:1.4;letter-spacing:.03em;word-break:keep-all;overflow-wrap:anywhere}
.ans-hw.long{font-size:clamp(34px,5.4vw,64px)}
.ans-hw rt{font-family:var(--f-jp);font-size:.33em;font-weight:500;color:var(--accent);letter-spacing:.02em}
.ans-read{font-size:clamp(22px,2.6vw,30px);color:var(--ink-2);letter-spacing:.08em}
.ans-mean{font-size:clamp(24px,3vw,36px);font-weight:700;line-height:1.3;margin-top:2px}
.ans-sub{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:15px;color:var(--ink-2);margin-top:6px}
.ans-sub b{color:var(--ink);font-weight:500}
.spk{width:48px;height:48px;border-radius:50%;display:inline-grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);flex:none}
.spk:active{background:var(--surface-2)}
.spk.lg{width:58px;height:58px;color:var(--ink)}
.spk svg{width:24px;height:24px}
.starw{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);margin-left:auto}
.starw svg{width:17px;height:17px}
.starw[aria-pressed="true"]{color:var(--stamp);border-color:var(--stamp)}
.pt{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.pt-l{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;font-weight:500;background:var(--accent);color:var(--on-accent);padding:3px 8px 2px;border-radius:2px}
.pt p{font-size:clamp(15px,1.6vw,18px);line-height:1.6}
.sec-h{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);margin-bottom:4px}
.sec-h .rule{flex:1;border-top:1px dashed var(--line);min-width:12px}
.sec-h .aux{font-family:var(--f-mono);font-weight:400;color:var(--ink-3)}
.sent{padding:12px 0 14px;border-top:1px solid var(--line-2)}
.sent:first-of-type{border-top:0;padding-top:4px}
.sent-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scene{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--ink-2)}
.scene b{font-weight:600;font-size:12px;padding:2px 7px;border:1px solid var(--ink-3);border-radius:4px;color:var(--ink)}
.jp{font-size:clamp(19px,2.3vw,26px);line-height:2.25;margin:2px 0 3px;color:var(--ink)}
.ko{font-size:clamp(15px,1.7vw,19px);color:var(--ink-2);line-height:1.6;border-radius:4px}
.furi-off .sent:not(.peek) .jp rt{visibility:hidden}
.furi-off .sk-j rt{visibility:hidden}
.tb.furi .furi-ic{font-family:var(--f-jp);font-size:19px;font-weight:700;line-height:1;width:21px;text-align:center}
.tb.furi[aria-pressed="false"] .furi-ic{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
.tr-off .sent:not(.peek) .ko{color:transparent;background:var(--mask);-webkit-user-select:none;user-select:none}
.tr-off .sent .ko,.furi-off .sent .jp{cursor:pointer}
.pairs{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:baseline;gap:8px;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left}
.pchip b{font-family:var(--f-kyo);font-weight:600;font-size:20px}
.pchip span{font-size:14px;color:var(--ink-2)}
.kp{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.kp>summary{list-style:none;cursor:pointer;min-height:54px;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.kp>summary::-webkit-details-marker{display:none}
.kp .k-l{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.04em}
.kp .k-sum{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:15px}
.kp .k-sum span b{font-family:var(--f-kyo);font-weight:600;font-size:21px;margin-right:4px}
.kp .fold{margin-left:auto;font-size:13px;color:var(--ink-3);white-space:nowrap}
.kp .fold::after{content:"펼치기 +"}
.kp[open] .fold::after{content:"접기 −"}
.kp-in{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.juku{font-size:14px;color:var(--ink-2);border:1px dashed var(--line);border-radius:6px;padding:9px 12px}
.kc{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;padding:12px;background:var(--bg);border:1px solid var(--line-2);border-radius:8px}
.kc-big{position:relative;width:76px;height:76px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-kyo);font-weight:500;font-size:54px;line-height:1;background:var(--surface)}
.kc-big::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  repeating-linear-gradient(to bottom,var(--line) 0 3px,transparent 3px 7px) center/1px 100% no-repeat,
  repeating-linear-gradient(to right,var(--line) 0 3px,transparent 3px 7px) center/100% 1px no-repeat}
.kc-big span{position:relative}
.kc-body{display:flex;flex-direction:column;gap:5px;min-width:0}
.kc-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:17px;font-weight:600}
.kc-h small{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--ink-3)}
.kv{display:flex;flex-wrap:wrap;gap:3px 8px;align-items:baseline;font-size:14px;color:var(--ink-2)}
.kv .lb{font-size:12px;font-weight:600;color:var(--ink-3);min-width:2.9em}
.rad{font-family:var(--f-kyo);font-weight:600;font-size:20px;color:var(--stamp);line-height:1}
.kx{font-size:15px;color:var(--ink);line-height:1.55}
.here{display:inline-flex;align-items:baseline;gap:8px;font-size:14px;padding:3px 10px;border-radius:999px;background:var(--tg);color:var(--ink)}
.here small{font-size:12px;color:var(--ink-2)}
.rel{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rel .lb{font-size:12px;font-weight:600;color:var(--ink-3);margin-right:2px}

/* ---------- 목록 ---------- */
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.search{width:100%;min-height:50px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 14px;-webkit-appearance:none;appearance:none}
.search::placeholder{color:var(--ink-3)}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.cats .chip{flex:none}
.list-meta{font-size:13px;color:var(--ink-3);padding:2px 0 6px;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-2)}
.list li{display:flex;align-items:stretch;border-bottom:1px solid var(--line-2)}
.row{flex:1;min-width:0;display:grid;grid-template-columns:48px minmax(0,1.25fr) minmax(0,1fr) auto;grid-template-areas:"n w m d";align-items:center;gap:6px 14px;padding:12px 2px;text-align:left;min-height:58px}
.row .num{grid-area:n;font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.rw{grid-area:w;display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.rw .w{font-family:var(--f-kyo);font-weight:500;font-size:22px;line-height:1.3}
.rw .r{font-size:14px;color:var(--ink-2)}
.rm{grid-area:m;font-size:15px;min-width:0}
.rd{grid-area:d;display:flex;align-items:center;gap:8px;justify-self:end}
.miss{font-family:var(--f-mono);font-size:12px;color:var(--ng)}
.dot{width:10px;height:10px;border-radius:50%}
.st-new{border:1.5px solid var(--line)}.st-ok{background:var(--ok)}.st-ng{background:var(--ng)}
.st-weak{background:var(--bg);box-shadow:0 0 0 2px var(--stamp)}
@media (max-width:640px){.row{grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"n w d" "n m d"}}
.masked .row:not(.peek) .rm,.masked .row:not(.peek) .rw .r{color:transparent;background:var(--mask);border-radius:4px}
.del{flex:none;min-width:64px;padding:0 12px;font-size:14px;font-weight:600;color:var(--ng)}
.del:active{background:var(--ng-bg)}
.empty-note{padding:24px 4px;font-size:15px;color:var(--ink-2)}

/* ---------- 시트·모달 ---------- */
.sheet-wrap,.modal-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal-wrap{z-index:45;align-items:center;padding:16px}
.sheet-bg,.modal-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:980px;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:900px){.sheet-wrap{align-items:center;padding:24px}.sheet{border-radius:14px;max-height:92%;padding-bottom:0}}
.sheet-head{flex:none;display:flex;align-items:center;gap:8px;padding-inline:16px 10px;padding-block:8px;border-bottom:1px solid var(--line)}
.sheet-title{font-weight:600;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-inline:16px;padding-block:16px 28px}
.sheet-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.modal{position:relative;width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:26px 22px 20px}
.dlg{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.dlg h2{font-size:22px;font-weight:700;line-height:1.35}
.dlg p{font-size:16px;color:var(--ink-2);line-height:1.6}
.dlg-acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;margin-top:6px}
.dlg-acts .btn{flex:1 1 150px;min-height:56px;font-size:17px}
.sum{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;text-align:left;font-size:15px;padding:12px 4px;border-block:1px dashed var(--line)}
.sum dt{color:var(--ink-3)}
.sum dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.hanko{flex:none;width:84px;height:84px;border:4px solid var(--stamp);border-radius:50%;display:grid;place-items:center;color:var(--stamp);font-family:var(--f-kyo);font-weight:600;font-size:44px;line-height:1;transform:rotate(-9deg)}
.set{display:flex;flex-direction:column;gap:22px}
.set section{display:flex;flex-direction:column;gap:9px}
.set h3{font-size:15px;font-weight:600}
.set .hint{font-size:13px;color:var(--ink-3);line-height:1.6}
.set input[type="date"]{min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 12px;max-width:240px}
.danger-zone{border-top:1px dashed var(--line);padding-top:16px;margin-top:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fill);color:var(--on-fill);padding:10px 12px 10px 18px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.toast-act{min-height:40px;padding:0 12px;border-radius:8px;font-weight:700;color:var(--on-fill);border:1px solid currentColor}
.hint-card{display:flex;align-items:flex-start;gap:12px;padding:14px 8px 14px 18px;border:1px solid var(--accent);border-radius:12px;background:var(--surface)}
.hint-card div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.hint-card b{font-size:16px;font-weight:700}
.hint-card span{font-size:14px;color:var(--ink-2);line-height:1.6}
.code-box{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:var(--f-mono);font-size:12px;line-height:1.5;padding:10px 12px;resize:vertical;word-break:break-all;-webkit-user-select:text;user-select:text;text-align:left}
.set a{color:var(--accent);text-underline-offset:3px}

/* ---------- 가볍게 1회독 · 소리 모드 · 이야기 ---------- */
.w9,.w10{font-size:clamp(32px,min(6.6vw,10.5vh),84px);letter-spacing:0}
.w11,.w12{font-size:clamp(28px,min(5.6vw,9vh),72px);letter-spacing:0}
.ans-hw.xlong{font-size:clamp(28px,4.2vw,50px)}
.lite{width:100%;border-radius:16px;background:var(--surface);border:2px solid var(--stamp);display:flex;flex-direction:column;gap:10px;padding:16px 18px;box-shadow:var(--shadow)}
.lite-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lite-h b{font-size:clamp(19px,2.3vw,24px);font-weight:700}
.lite-h span{font-size:14px;color:var(--ink-2)}
.lite-p{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lite-p .lbar{flex:1;height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}
.lite-p .lbar i{display:block;height:100%;background:var(--stamp)}
.lite-acts{display:flex;gap:10px;flex-wrap:wrap}
.lite-acts .btn{flex:1 1 160px}
.btn.stamp{background:var(--stamp);color:var(--on-stamp);border-color:var(--stamp)}
.part-h{font-size:13px;color:var(--ink-3);margin-top:-4px}
.lt{display:flex;flex-direction:column;gap:18px;padding-block:6px 10px}
.lt-a,.lt-b{display:contents}
.lt-head{order:1}.lt-story{order:2}.lt-pt{order:3}.lt-ex{order:4}
@media (min-width:960px){.lt{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:36px;align-items:start}.lt-a,.lt-b{display:flex;flex-direction:column;gap:18px;min-width:0}}
.lt-head{display:flex;flex-direction:column;gap:4px}
.lt-word{font-family:var(--f-kyo);font-weight:500;font-size:clamp(46px,7vw,92px);line-height:1.45;letter-spacing:.03em;text-align:left;padding:2px 8px;margin-left:-8px;border-radius:14px;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}
.lt-word.long{font-size:clamp(32px,5vw,62px)}
.lt-word.xlong{font-size:clamp(26px,3.8vw,46px)}
.lt-word rt{font-family:var(--f-jp);font-size:.32em;font-weight:500;color:var(--accent)}
.lt-word:active{background:var(--surface-2)}
.lt-read{font-size:clamp(20px,2.4vw,28px);color:var(--ink-2);letter-spacing:.06em}
.lt-mean{font-size:clamp(24px,3vw,36px);font-weight:700;line-height:1.3}
.lt-mean .lt-ko{display:inline-block;font-weight:600;color:var(--accent);margin-right:10px}
.story{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 14px}
.story .sl{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;font-weight:500;align-self:flex-start;background:var(--stamp);color:var(--on-stamp);padding:3px 8px 2px;border-radius:2px}
.lk{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:start}
.lk-big{width:46px;height:46px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-family:var(--f-kyo);font-weight:500;font-size:32px;line-height:1;background:var(--bg)}
.lk-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.lk-hs{font-size:14px;color:var(--ink-2);line-height:1.45}
.lk-hs b{font-size:16px;font-weight:700;color:var(--ink);margin-right:2px}
.lk-x{font-size:15px;line-height:1.5;color:var(--ink)}
.st-w{font-size:clamp(16px,1.8vw,19px);line-height:1.65;font-weight:600;border-top:1px dashed var(--line);padding-top:10px}
.st-w::before{content:"단어 → ";color:var(--stamp);font-weight:700}
.lt-ex .jp{margin:0}
.lt-ex .ko{color:var(--ink-2)}
.lt-ex .sent{border:0;padding:4px 0 0}
.lis-btn{width:min(46vw,260px);height:min(46vw,260px);border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow)}
.lis-btn svg{width:42%;height:42%}
.lis-btn:active{filter:brightness(.92)}
.tb.lis[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.s-story{order:2}
.tb-t+.tb-t{margin-left:4px}
.t-L{border-color:var(--stamp);color:var(--stamp)}
.gf .g-wk{font-size:13px;font-weight:700;color:var(--ink-2)}
.pw{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:2px 0 12px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px}
.pw b{font-size:15px}
.pw .pw-n{font-size:13px;color:var(--ink-3)}
.pw .grow{flex:1}
@media (prefers-reduced-motion:no-preference){
  .cf-mid,.ex,.dlg{animation:fade .14s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
}

/* ---------- 미니멀: 흑백 + 회색 단계만 (10/5) ---------- */
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F2F2F2;
  --ink:#111111;--ink-2:#555555;--ink-3:#8A8A8A;
  --line:#E2E2E2;--line-2:#EFEFEF;
  --accent:#111111;--on-accent:#FFFFFF;--fill:#111111;--on-fill:#FFFFFF;
  --stamp:#111111;--on-stamp:#FFFFFF;
  --ng:#B3261E;--ng-bg:#FFFFFF;--ok:#111111;--ok-bg:#FFFFFF;
  --bkA:#FFFFFF;--bkA2:#FFFFFF;--bkB:#FFFFFF;--bkB2:#FFFFFF;--bkZ:#FFFFFF;--bkZ2:#FFFFFF;
  --on-bk:#111111;--on-bk2:#8A8A8A;--ribbon:#111111;--on-ribbon:#FFFFFF;
  --tg:transparent;--mask:#ECECEC;--scrim:rgba(0,0,0,.35);--shadow:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111111;--surface:#181818;--surface-2:#232323;
  --ink:#EDEDED;--ink-2:#A6A6A6;--ink-3:#767676;
  --line:#2E2E2E;--line-2:#242424;
  --accent:#EDEDED;--on-accent:#111111;--fill:#EDEDED;--on-fill:#111111;
  --stamp:#EDEDED;--on-stamp:#111111;
  --ng:#F2B8B5;--ng-bg:#181818;--ok:#EDEDED;--ok-bg:#181818;
  --bkA:#181818;--bkA2:#181818;--bkB:#181818;--bkB2:#181818;--bkZ:#181818;--bkZ2:#181818;
  --on-bk:#EDEDED;--on-bk2:#767676;--ribbon:#EDEDED;--on-ribbon:#111111;
  --tg:transparent;--mask:#262626;--scrim:rgba(0,0,0,.6);--shadow:none}}
:root[data-theme="dark"]{
  --bg:#111111;--surface:#181818;--surface-2:#232323;
  --ink:#EDEDED;--ink-2:#A6A6A6;--ink-3:#767676;
  --line:#2E2E2E;--line-2:#242424;
  --accent:#EDEDED;--on-accent:#111111;--fill:#EDEDED;--on-fill:#111111;
  --stamp:#EDEDED;--on-stamp:#111111;
  --ng:#F2B8B5;--ng-bg:#181818;--ok:#EDEDED;--ok-bg:#181818;
  --bkA:#181818;--bkA2:#181818;--bkB:#181818;--bkB2:#181818;--bkZ:#181818;--bkZ2:#181818;
  --on-bk:#EDEDED;--on-bk2:#767676;--ribbon:#EDEDED;--on-ribbon:#111111;
  --tg:transparent;--mask:#262626;--scrim:rgba(0,0,0,.6);--shadow:none}
.dchip{background:transparent;color:var(--ink);border:1px solid var(--ink);font-weight:600}
.resume{background:var(--surface);color:var(--ink);border:1px solid var(--ink)}
.resume:active{filter:none;background:var(--surface-2)}
.book{border:1px solid var(--line)}
.book.blkZ{border-color:var(--ink)}
.book .spine{display:none}
.book:active{filter:none;background:var(--surface-2)}
.b-acts{left:0}
.b-btn{border:1px solid var(--line);color:var(--ink-2)}
.b-btn:active{background:var(--surface-2)}
.ribbon{top:0;clip-path:none;border-radius:0 0 8px 0;padding:3px 10px;font-size:12px;font-weight:600}
.lite{border:1px solid var(--line)}
.lite-p .lbar{height:4px}
.pt{border-color:var(--line)}
.pt-l,.story .sl{background:transparent;color:var(--ink-3);padding:0;border-radius:0;letter-spacing:.12em}
.st-w::before{color:var(--ink-3)}
.rad{color:var(--ink)}
.hanko{border-color:var(--ink-3);color:var(--ink-3)}
.lt-mean .lt-ko{color:var(--ink-2)}
.ans-hw rt,.lt-word rt{color:var(--ink-3)}
.tg{background:none;font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.24em}
.ab{box-shadow:none;border:1px solid var(--line)}
.ab:active{transform:none;background:var(--surface-2)}
.ab-ex,.ab-ng{background:var(--surface);color:var(--ink)}
.ab-ok,.ab-next{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
.ab-ok:active,.ab-next:active{background:var(--fill);opacity:.85}
.phase{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.star[aria-pressed="true"],.starw[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.miss{color:var(--ink-3)}

<script>
/* 한자 카드 그리기: kz/kz_render.js (빌드 때 그대로 읽어 넣음) */
/* 한자 카드 그리기 (샘플 3 틀) — 앱과 미리보기가 같이 씀. 카드 자료는 kzc.py compile 결과 */
const KZ_EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const KZ_INK = '#1A2133';
const kzE = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
/* 글 꾸밈: **굵게**, 가나 덩어리는 일본어 글씨로 */
function kzMark(s) {
  return kzE(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/([ぁ-ゖァ-ヺー〜・]+)/g, '<span lang="ja">$1</span>');
}
function kzStrokes(card, idx, cols, vb, sw) {
  const sz = vb[2], w = sw || (3.2 * sz / 109 * 1.6);
  let p = '';
  for (let j = 0; j < idx.length; j++) p += '<path d="' + card.S[idx[j]] + '" stroke="' + (Array.isArray(cols) ? cols[j] : cols) + '"/>';
  return '<g fill="none" stroke-width="' + w.toFixed(2) + '" stroke-linecap="round" stroke-linejoin="round">' + p + '</g>';
}
function kzBox(card, idx, cols, vb, cls) {
  return '<svg viewBox="' + vb[0] + ' ' + vb[1] + ' ' + vb[2] + ' ' + vb[2] + '"' + (cls ? ' class="' + cls + '"' : '') + ' aria-hidden="true">' + kzStrokes(card, idx, cols, vb) + '</svg>';
}
function kzItems(card, items) {
  let o = '';
  for (const it of items || []) {
    const x = it.x == null ? 50 : it.x, y = it.y == null ? 50 : it.y;
    const tf = (it.r ? 'rotate(' + it.r + ' ' + x + ' ' + y + ')' : '') + (it.flip ? ' translate(' + (2 * x) + ' 0) scale(-1 1)' : '');
    const T = tf ? ' transform="' + tf.trim() + '"' : '';
    const op = it.o != null ? ' opacity="' + it.o + '"' : '';
    if (it.e != null) o += '<text x="' + x + '" y="' + y + '" font-size="' + (it.s || 40) + '" text-anchor="middle" dominant-baseline="central" style=\'font-family:' + KZ_EMO + '\'' + T + op + '>' + kzE(it.e) + '</text>';
    else if (it.t != null) o += '<text x="' + x + '" y="' + y + '" font-size="' + (it.s || 12) + '" text-anchor="middle" dominant-baseline="central" fill="' + (it.c || KZ_INK) + '" font-weight="' + (it.w || 800) + '" class="kz-stt"' + T + op + '>' + kzE(it.t) + '</text>';
    else if (it.plus) o += '<text x="' + it.plus[0] + '" y="' + it.plus[1] + '" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#7A8296" class="kz-stt">+</text>';
    else if (it.arrow) {

  if (H.wr && (!best || H.wr.u > best.u)) best = {kind: 'weak', u: H.wr.u, r: H.wr};
  for (const k in H.wrp) { const r = H.wrp[k]; if (r && (!best || r.u > best.u)) best = {kind: 'weak', g: k, u: r.u, r}; }
  return best;
}

/* ================= 10/16 한자: 한자 카드 시트 · 한자 단원 =================

/* ----- 한자 단원 공부: 단어 공부와 같은 흐름(앞면 → 해설 → 모르겠음/알고있음 → 다음, 모르는 것만 라운드 반복·섞기) ----- */

/* 이 단어에서의 읽기가 음독인지 훈독인지 (확실할 때만 표시) */
const ROWS = ['あいうえお', 'かきくけこ', 'さしすせそ', 'たちつてと', 'なにぬねの', 'はひふへほ', 'まみむめも', 'やゆよ', 'らりるれろ', 'わを'];
const rowOf = ch => ROWS.findIndex(r => r.includes(ch));
function readKind(ch, reading) {
  const k = K[ch]; if (!k || !reading) return '';
  const r = plain(reading);
  const onH = k.on.map(o => plain(toHira(o)));
  const gem = x => x.length > 1 && /[つちくき]$/.test(x) ? x.slice(0, -1) + 'っ' : null;
  if (onH.some(o => o === r || gem(o) === r)) return '음독';
  const kun = [];
  k.kun.forEach(x => { const m = /^([^()]+)(?:\(([^)]*)\))?/.exec(x.replace(/[-.]/g, '')); if (m) { kun.push(plain(m[1])); if (m[2]) kun.push(plain(m[1] + m[2])); } });
  const conj = f => f.length === r.length && f.length >= 2 && f.slice(0, -1) === r.slice(0, -1) && rowOf(f.slice(-1)) >= 0 && rowOf(f.slice(-1)) === rowOf(r.slice(-1));
  if (kun.some(f => f === r || conj(f) || (f.length === r.length + 1 && f.endsWith('る') && f.slice(0, -1) === r))) return '훈독';
  return '';
}

    return '<div class="kc"><div class="kc-big" lang="ja"><span>' + esc(ch) + '</span></div><div class="kc-body">' +
      '<div class="kc-h"><span>' + esc(k.h) + '</span><small>' + k.n + '획</small></div>' +
      '<div class="kv"><span class="lb">부수</span><span class="rad" lang="ja">' + esc(k.b) + '</span><span>' + esc(k.bn) + '</span></div>' +
      '<div class="kv"><span class="lb">구성</span><span>' + mixJa(k.s) + '</span></div>' +
      '<p class="kx">' + emArrow(k.x, true) + '</p>' +
      '<div class="kv"><span class="lb">음</span><span lang="ja">' + (k.on.length ? esc(k.on.map(toHira).join('・')) : '—') + '</span></div>' +
      '<div class="kv"><span class="lb">훈</span><span lang="ja">' + (k.kun.length ? esc(k.kun.join('・')) : '—') + '</span></div>' +
      here +
      (rel.length ? '<div class="rel"><span class="lb">같은 한자</span>' + rel.map(o => '<button class="chip" data-act="open" data-id="' + o.id + '"><span lang="ja">' + esc(o.w) + '</span></button>').join('') + '</div>' : '') +
    '</div></div>';
  }).join('');
  return '<details class="s-kp kp"' + (S.kp ? ' open' : '') + '><summary><span class="k-l">한자·부수 풀이</span><span class="k-sum">' + summary + '</span><span class="fold"></span></summary>' +

}
